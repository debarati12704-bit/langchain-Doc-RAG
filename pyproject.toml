[project]
name = "langchain-doc-rag"
version = "0.1.0"
description = "A doc-based projectmade to learn LangChain and RAG."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface[full]>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "requests>=2.34.2",
]
[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"
module-root = "src"
